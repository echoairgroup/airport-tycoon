name: Build and deploy Airport Tycoon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: airport-tycoon-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore the complete game source when needed
        shell: bash
        run: |
          if compgen -G ".github/source.part-*" > /dev/null; then
            cat .github/source.part-* | base64 --decode > /tmp/airport-tycoon-source.tar.xz
            tar -xJf /tmp/airport-tycoon-source.tar.xz -C .
            rm -f .github/source.part-*
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Restore Airport Tycoon Arcade source and CSS"
              git push origin HEAD:main
            fi
          fi
          test -f src/main.js
          test -f src/style.css
          test -f src/arcade-overrides.css

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run game tests
        run: npm test

      - name: Build production website
        run: npm run build

      - name: Verify CSS is present in the production output
        shell: bash
        run: |
          test -s dist/index.html
          CSS_PATH="$(grep -oE 'href="[^"]+[.]css"' dist/index.html | head -n 1 | cut -d '"' -f 2)"
          test -n "$CSS_PATH"
          CSS_FILE="dist/${CSS_PATH#./}"
          test -s "$CSS_FILE"
          echo "Verified stylesheet: $CSS_FILE"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
