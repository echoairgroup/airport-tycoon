name: Apply Airport Tycoon Arcade update

on:
  push:
    branches:
      - main
    paths:
      - "Airport-Tycoon-Arcade-0.2.1.part-*"

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and unpack project
        shell: bash
        run: |
          set -euo pipefail
          cat Airport-Tycoon-Arcade-0.2.1.part-* | base64 --decode > "$RUNNER_TEMP/airport-tycoon.zip"
          mkdir -p "$RUNNER_TEMP/airport-tycoon-update"
          unzip -q "$RUNNER_TEMP/airport-tycoon.zip" -d "$RUNNER_TEMP/airport-tycoon-update"
          cp -a "$RUNNER_TEMP/airport-tycoon-update/airport-tycoon/." .
          rm -f Airport-Tycoon-Arcade-0.2.1.part-*
          rm -f .github/workflows/apply-arcade-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to apply."
            exit 0
          fi
          git commit -m "Apply Airport Tycoon Arcade 0.2.1"
          git push origin HEAD:main
